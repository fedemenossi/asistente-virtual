<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Panel" }}</title>
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.svg" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/dist/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div class="relative min-h-screen bg-slate-50">
      <div data-sidebar-overlay class="fixed inset-0 z-30 hidden bg-slate-900/40 lg:hidden"></div>
      {% include "layout/partials/sidebar.html" %}
      <div class="lg:pl-64">
        {% include "layout/partials/topbar.html" %}
        <main class="px-6 pb-12 pt-6">
          {% include "layout/partials/flash.html" %}
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
    <div data-install-banner class="fixed bottom-4 left-4 right-4 z-50 hidden rounded-xl border border-slate-200 bg-white p-4 shadow-soft lg:left-auto lg:right-6 lg:w-80">
      <div class="flex items-start gap-3">
        <div class="grid h-10 w-10 place-items-center rounded-lg bg-slate-900 text-white">+</div>
        <div class="flex-1">
          <p class="text-sm font-semibold text-slate-900">Instalar app</p>
          <p class="text-xs text-slate-600">Acceso rapido desde tu telefono.</p>
          <div class="mt-3 flex gap-2">
            <button data-install-accept class="btn btn-primary text-xs">Instalar</button>
            <button data-install-dismiss class="btn btn-secondary text-xs">Ahora no</button>
          </div>
        </div>
      </div>
    </div>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
