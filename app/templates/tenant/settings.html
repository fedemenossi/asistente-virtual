{% extends "layout/base.html" %}

{% set title = "Settings" %}
{% set breadcrumb = "Tenant / Settings" %}

{% block content %}
  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-slate-900">Configuracion</h1>
    <p class="text-sm text-slate-600">Solo campos permitidos.</p>
  </div>
  <form method="post" class="card p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div>
      <label class="block text-sm font-medium text-slate-700">Nombre del tenant</label>
      <input class="input mt-1" name="nombre" value="{{ tenant.nombre }}" required />
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" type="submit">Guardar</button>
    </div>
  </form>
{% endblock %}
