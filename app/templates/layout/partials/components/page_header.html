{% macro page_header(title, subtitle="", eyebrow="", icon="dashboard") %}
  <div class="page-header page-header-pro">
    <div class="flex min-w-0 items-center gap-4">
      <span class="page-heading-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          {% if icon == "calendar" %}
            <rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path>
          {% elif icon == "patients" %}
            <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path>
          {% else %}
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          {% endif %}
        </svg>
      </span>
      <div class="min-w-0">
        {% if eyebrow %}<p class="page-eyebrow">{{ eyebrow }}</p>{% endif %}
        <h1 class="page-title">{{ title }}</h1>
        {% if subtitle %}<p class="page-subtitle">{{ subtitle }}</p>{% endif %}
      </div>
    </div>
    {% if caller is defined %}
      <div class="flex flex-wrap items-center gap-2">{{ caller() }}</div>
    {% endif %}
  </div>
{% endmacro %}
