{% macro pagination(page, total_pages, base_url, query_string="") %}
  {% set qs = "&" ~ query_string if query_string else "" %}
  <div class="pagination">
    {% if page > 1 %}
      <a class="pagination-item" href="{{ base_url }}?page={{ page - 1 }}{{ qs }}" aria-label="Pagina anterior">
        <span aria-hidden="true">&lsaquo;</span>
      </a>
    {% else %}
      <span class="pagination-item pagination-item-disabled" aria-hidden="true">&lsaquo;</span>
    {% endif %}
    <span class="pagination-item pagination-item-active">{{ page }}</span>
    {% if page < total_pages %}
      <a class="pagination-item" href="{{ base_url }}?page={{ page + 1 }}{{ qs }}" aria-label="Pagina siguiente">
        <span aria-hidden="true">&rsaquo;</span>
      </a>
    {% else %}
      <span class="pagination-item pagination-item-disabled" aria-hidden="true">&rsaquo;</span>
    {% endif %}
  </div>
{% endmacro %}
