{% extends "layout/base.html" %}{% set title="Nueva factura manual" %}{% block content %}
<div class="mb-6"><h1 class="text-2xl font-semibold">Nueva Factura C manual</h1><p class="text-sm text-slate-600">Servicios en pesos argentinos. La emision usa la configuracion ARCA de produccion.</p></div>
<form method="post" action="/t/billing/manual/preview" class="card max-w-3xl space-y-4 p-6"><input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
<label>Fuente del receptor<select class="select" name="receiver_type"><option value="patient">Paciente</option><option value="contact">Contacto fiscal</option><option value="provisional">Receptor provisorio</option></select></label>
<label>Paciente<select class="select" name="patient_id">{% for patient in patients %}<option value="{{ patient.id }}">{{ patient.apellido }}, {{ patient.nombre }} — {{ patient.dni }}</option>{% endfor %}</select></label>
<label>Contacto fiscal<select class="select" name="contact_id"><option value="">Seleccionar</option>{% for contact in contacts %}<option value="{{ contact.id }}">{{ contact.name }} — {{ contact.document_type }} {{ contact.document_number }}</option>{% endfor %}</select></label>
<div class="grid gap-2 md:grid-cols-2"><input class="input" name="provisional_name" placeholder="Nombre / razon social provisorio" /><select class="select" name="provisional_document_type"><option>DNI</option><option>CUIT</option></select><input class="input" name="provisional_document_number" placeholder="DNI o CUIT" /><select class="select" name="provisional_iva_condition"><option value="consumidor_final">Consumidor final</option><option value="responsable_inscripto">Responsable inscripto</option><option value="monotributista">Monotributista</option></select><input class="input" type="email" name="provisional_email" placeholder="Email" /></div>
<label>Item facturable<select class="select" name="item_id" required>{% for item in items %}<option value="{{ item.id }}">{{ item.name }} — $ {{ item.unit_price }}</option>{% endfor %}</select></label>
<label>Importe facturado<input class="input" name="amount" required /></label>
<div class="grid gap-4 md:grid-cols-2"><label>Desde<input class="input" type="date" name="service_start" value="{{ today }}" required /></label><label>Hasta<input class="input" type="date" name="service_end" value="{{ today }}" required /></label></div>
<label>Condicion de venta<select class="select" name="sale_condition">{% for value in sale_conditions %}<option value="{{ value }}">{{ value }}</option>{% endfor %}</select></label>
<label><input type="checkbox" name="send_email" checked /> Enviar por email al autorizar</label><div><button class="btn btn-primary">Previsualizar</button><a class="btn btn-secondary" href="/t/billing/invoices">Cancelar</a></div></form>{% endblock %}
