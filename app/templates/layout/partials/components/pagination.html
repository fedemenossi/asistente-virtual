{% macro pagination(page, total_pages, base_url, query_string="") %}
  {% set qs = "&" ~ query_string if query_string else "" %}
  <div class="mt-6 flex items-center justify-between">
    <p class="text-sm text-slate-600">Pagina {{ page }} de {{ total_pages }}</p>
    <div class="flex items-center gap-2">
      {% if page > 1 %}
        <a class="btn btn-secondary" href="{{ base_url }}?page={{ page - 1 }}{{ qs }}">Anterior</a>
      {% endif %}
      {% if page < total_pages %}
        <a class="btn btn-secondary" href="{{ base_url }}?page={{ page + 1 }}{{ qs }}">Siguiente</a>
      {% endif %}
    </div>
  </div>
{% endmacro %}
