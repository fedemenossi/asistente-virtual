<!DOCTYPE html>
<html lang="es" data-design-system="clinical-ui-v2">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingreso</title>
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/dist/tailwind.css" />
  </head>
  <body class="auth-shell text-slate-900">
    <div class="grid min-h-screen place-items-center px-5 py-10">
      <div class="auth-card w-full max-w-md">
        <div class="mb-7">
          <div class="mb-6 flex items-center gap-3">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
            <div><p class="text-sm font-extrabold text-slate-950">Nubelio Salud</p><p class="text-xs text-slate-500">Gestión de turnos médicos</p></div>
          </div>
          <p class="page-eyebrow">Acceso seguro</p>
          <h1 class="text-2xl font-extrabold text-slate-950">Ingresá a tu panel</h1>
          <p class="mt-2 text-sm text-slate-600">Administrá turnos, pacientes y conversaciones desde un solo lugar.</p>
        </div>
        {% include "layout/partials/flash.html" %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </body>
</html>
