{% macro input(name, label, value="", type="text", placeholder="", required=False) %}
  <label class="block text-sm font-medium text-slate-700">{{ label }}</label>
  <input
    class="input mt-1"
    type="{{ type }}"
    name="{{ name }}"
    value="{{ value }}"
    placeholder="{{ placeholder }}"
    {% if required %}required{% endif %}
  />
{% endmacro %}
