{% macro pagination(page, total_pages, base_url, query_string="") %}
  {% set qs = "&" ~ query_string if query_string else "" %}
  <div class="pagination">
    <p class="text-sm font-medium text-slate-600">Pagina {{ page }} de {{ total_pages }}</p>
    <div class="flex items-center gap-2">
      {% if page > 1 %}
        <a class="pagination-item" href="{{ base_url }}?page={{ page - 1 }}{{ qs }}">Anterior</a>
      {% endif %}
      <span class="pagination-item pagination-item-active">{{ page }}</span>
      {% if page < total_pages %}
        <a class="pagination-item" href="{{ base_url }}?page={{ page + 1 }}{{ qs }}">Siguiente</a>
      {% endif %}
    </div>
  </div>
{% endmacro %}
