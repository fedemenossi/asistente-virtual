{% macro stat_card(label, value, detail="", tone="indigo", icon="calendar") %}
  <article class="dashboard-kpi" data-tone="{{ tone }}">
    <span class="dashboard-kpi-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        {% if icon == "chat" %}<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
        {% elif icon == "patients" %}<path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path>
        {% elif icon == "clock" %}<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
        {% else %}<rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path>{% endif %}
      </svg>
    </span>
    <div class="min-w-0">
      <p class="dashboard-kpi-label">{{ label }}</p>
      <p class="dashboard-kpi-value">{{ value }}</p>
      {% if detail %}<p class="dashboard-kpi-detail">{{ detail }}</p>{% endif %}
    </div>
  </article>
{% endmacro %}
