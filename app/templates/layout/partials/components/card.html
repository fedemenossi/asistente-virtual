{% macro card(title, subtitle="") %}
  <div class="content-card p-5">
    <div class="mb-4">
      <p class="text-base font-semibold text-slate-950">{{ title }}</p>
      {% if subtitle %}<p class="text-xs text-slate-600">{{ subtitle }}</p>{% endif %}
    </div>
    {{ caller() }}
  </div>
{% endmacro %}
