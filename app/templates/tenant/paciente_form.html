{% extends "layout/base.html" %}

{% set is_edit = paciente is not none %}
{% set title = "Editar paciente" if is_edit else "Nuevo paciente" %}
{% set breadcrumb = "Tenant / Pacientes" %}

{% block content %}
  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-slate-900">{{ title }}</h1>
    <p class="text-sm text-slate-600">Datos basicos para el registro.</p>
  </div>
  <form method="post" class="card p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label class="block text-sm font-medium text-slate-700">Nombre</label>
        <input class="input mt-1" name="nombre" value="{{ paciente.nombre if paciente else '' }}" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Apellido</label>
        <input class="input mt-1" name="apellido" value="{{ paciente.apellido if paciente else '' }}" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Telefono</label>
        <input class="input mt-1" name="telefono" value="{{ paciente.telefono if paciente else '' }}" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">DNI</label>
        <input class="input mt-1" name="dni" value="{{ paciente.dni if paciente else '' }}" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Email</label>
        <input class="input mt-1" type="email" name="email" value="{{ paciente.email if paciente else '' }}" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Obra social</label>
        <input class="input mt-1" name="obra_social" value="{{ paciente.obra_social if paciente else '' }}" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Numero de afiliado</label>
        <input class="input mt-1" name="insurance_number" value="{{ paciente.insurance_number if paciente else '' }}" />
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-secondary" href="/t/pacientes">Cancelar</a>
    </div>
  </form>
{% endblock %}
