{% extends "layout/base.html" %}

{% set is_edit = consultorio is not none %}
{% set title = "Editar consultorio" if is_edit else "Nuevo consultorio" %}
{% set breadcrumb = "Tenant / Consultorios" %}

{% block content %}
  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-slate-900">{{ title }}</h1>
    <p class="text-sm text-slate-600">Configura la sede y el tipo de atencion.</p>
  </div>
  <form method="post" class="card p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div>
      <label class="block text-sm font-medium text-slate-700">Nombre</label>
      <input class="input mt-1" name="nombre" value="{{ consultorio.nombre if consultorio else '' }}" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Tipo</label>
      <select class="select mt-1" name="tipo">
        {% for t in tipos %}
          <option value="{{ t.value }}" {% if consultorio and consultorio.tipo.value == t.value %}selected{% endif %}>{{ t.value }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Proveedor turnos</label>
      <input class="input mt-1" name="proveedor_turnos" value="{{ consultorio.proveedor_turnos if consultorio else '' }}" />
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-secondary" href="/t/consultorios">Cancelar</a>
    </div>
  </form>
{% endblock %}
